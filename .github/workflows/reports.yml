name: Fundamentals reports

# Times are UTC. Each UK report time has two timers: one for UK summer time, one for winter time.
# bot.js checks the UK clock and the timer that doesn't match exits in seconds.
on:
  schedule:
    - cron: '0 6 * * 1-5'    # 07:00 UK summer  - morning brief
    - cron: '0 7 * * 1-5'    # 07:00 UK winter
    - cron: '0 12 * * 1-5'   # 13:00 UK summer  - midday
    - cron: '0 13 * * 1-5'   # 13:00 UK winter
    - cron: '32 12 * * 1-5'  # 13:32 UK summer  - data result (skipped if no release)
    - cron: '32 13 * * 1-5'  # 13:32 UK winter
    - cron: '25 13 * * 1-5'  # 14:25 UK summer  - before the NY open
    - cron: '25 14 * * 1-5'  # 14:25 UK winter
    - cron: '2 14 * * 1-5'   # 15:02 UK summer  - data result (skipped if no release)
    - cron: '2 15 * * 1-5'   # 15:02 UK winter
    - cron: '30 20 * * 1-5'  # 21:30 UK summer  - earnings (skipped if no big company reported)
    - cron: '30 21 * * 1-5'  # 21:30 UK winter
    - cron: '50 20 * * 1-5'  # 21:50 UK summer  - bot health summary to #bot-health
    - cron: '50 21 * * 1-5'  # 21:50 UK winter
    # breaking + crypto news every 15 min, 02:00-17:45 New York time all year (bot.js skips runs outside that)
    - cron: '*/15 7-21 * * 1-5'          # all year
    - cron: '*/15 6 * 3-11 1-5'          # 02:00 ET hour in US summer time
    - cron: '*/15 22 * 11,12,1,2,3 1-5'  # 17:00 ET hour in US winter time
    - cron: '7 */2 * * 0,6'       # breaking news every 2 h at weekends
  workflow_dispatch:
    inputs:
      slot:
        description: 'Report to send now'
        required: true
        default: morning
        type: choice
        options: [morning, midday, post1, preny, post2, earnings, health, news]

permissions:
  actions: read      # lets the health check read today's runs and logs
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # the news check remembers which headlines it has already seen (news_state.json), kept between runs here
      - uses: actions/cache/restore@v4
        with:
          path: |
            news_state.json
            crypto_state.json
          key: news-state-${{ github.run_id }}
          restore-keys: news-state-
      # the reports remember the last report's "what would change it" points (report_state.json)
      - uses: actions/cache/restore@v4
        with:
          path: report_state.json
          key: report-state-${{ github.run_id }}
          restore-keys: report-state-
      - run: node bot.js
        env:
          NEWS_WEBHOOK: ${{ secrets.NEWS_WEBHOOK }}
          CRYPTO_WEBHOOK: ${{ secrets.CRYPTO_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          HEALTH_WEBHOOK: ${{ secrets.HEALTH_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRON: ${{ github.event.schedule }}
          SLOT: ${{ github.event.inputs.slot }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('news_state.json', 'crypto_state.json') != ''
        with:
          path: |
            news_state.json
            crypto_state.json
          key: news-state-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('report_state.json') != ''
        with:
          path: report_state.json
          key: report-state-${{ github.run_id }}
