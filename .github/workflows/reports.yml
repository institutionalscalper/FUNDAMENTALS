name: Fundamentals reports

# Everything is started by cron-job.org (New York time zone) - GitHub's own timer skipped runs and ran the 10:02 report 4 h late.
#   news:    slot "news" every 15 min 02:00-17:45 ET weekdays, every 2 h at weekends
#   reports: slot "auto" at 02:00, 08:00, 08:32, 09:25, 10:02, 16:30, 16:50 ET weekdays (bot.js picks the report due now)
on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Report to send now'
        required: true
        default: morning
        type: choice
        options: [morning, midday, post1, preny, post2, earnings, health, news, auto]

permissions:
  actions: read      # lets the health check read today's runs and logs
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # the news check remembers which headlines it has already seen (news_state.json), kept between runs here
      - uses: actions/cache/restore@v4
        with:
          path: |
            news_state.json
            crypto_state.json
          key: news-state-${{ github.run_id }}
          restore-keys: news-state-
      # the reports remember the last report's "what would change it" points (report_state.json)
      - uses: actions/cache/restore@v4
        with:
          path: report_state.json
          key: report-state-${{ github.run_id }}
          restore-keys: report-state-
      - run: node bot.js
        env:
          NEWS_WEBHOOK: ${{ secrets.NEWS_WEBHOOK }}
          CRYPTO_WEBHOOK: ${{ secrets.CRYPTO_WEBHOOK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          HEALTH_WEBHOOK: ${{ secrets.HEALTH_WEBHOOK }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CRON: ${{ github.event.schedule }}
          SLOT: ${{ github.event.inputs.slot }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('news_state.json', 'crypto_state.json') != ''
        with:
          path: |
            news_state.json
            crypto_state.json
          key: news-state-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('report_state.json') != ''
        with:
          path: report_state.json
          key: report-state-${{ github.run_id }}
